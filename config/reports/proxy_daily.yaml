# ===========================================================================
# REPORT: Daily Forward-Proxy Traffic  (profile: proxy -> squid et al.)
# ===========================================================================
name: proxy_daily
slug: daily_proxy          # output filename prefix: <slug>_<datasource>_<date>
title: "Daily Proxy Traffic & Security Report"
profile: proxy
description: >
  Executive daily report for forward-proxy logs: client usage, destinations,
  denied requests, tunnel activity and bandwidth.

_defs:
  denied: &denied
    any:
      - {field: cache_action, wildcard: "*denied*"}
      - {field: status_code, in: [403, 407]}
  # Upstream connection failures (squid NONE/503 with HIER_NONE): the proxy
  # accepted the request but could not open the outbound connection. High
  # volumes usually mean upstream link / DNS trouble, not policy.
  failed: &failed
    {field: action_detail, equals: connection_failed}

params:
  window_hours: 24
  top_n: 10
  # Share of requests denied by policy before the badge and the action
  # turn. The observed everyday level is 2-3%, so amber starts above it.
  denied_rate_warn: 5.0
  denied_rate_crit: 10.0
  # Upstream connection-failure thresholds for the gateway-health badge.
  fail_rate_warn: 5.0
  fail_rate_crit: 15.0
  prev_window_min_ratio: 0.5
  # Ports that are NOT plain web browsing - worth an analyst's glance when
  # they show up through the proxy. 445 = SMB (worm/scanner traffic),
  # 6568 = AnyDesk, 5938 = TeamViewer, 853 = DNS-over-TLS (resolver
  # bypass), 1433/3306 = direct database access.
  unusual_ports: [22, 23, 25, 445, 3389, 5900, 1080, 4444, 6667, 9001,
                  9050, 6568, 5938, 853, 1433, 3306]
  # Ports in the list above that are ROUTINE for a campus: researchers and
  # admins SSH out to cloud VMs and remote labs every day, and the proxy
  # policy permits it. They stay visible in the table but raise an action
  # only on scan-like behaviour (below), never just for being used.
  routine_ports: [22]
  # One client opening tunnels to this many DISTINCT hosts on a routine port
  # is scanning / brute-forcing, not administering a server.
  routine_port_scan_min: 25

queries:
  total_requests: {kind: count}
  unique_clients: {kind: cardinality, field: client_ip}
  total_bytes: {kind: sum, field: bytes}
  denied_total: {kind: count, filter: *denied}
  success_total: {kind: count, optional: true,
                  filter: {field: outcome, equals: success}}
  failed_total: {kind: count, filter: *failed, optional: true}

  hourly_failed:
    kind: date_histogram
    interval: hour
    filter: *failed
    optional: true

  hourly:
    kind: date_histogram
    interval: hour
    sub_aggs:
      clients: {kind: cardinality, field: client_ip}

  hourly_denied:
    kind: date_histogram
    interval: hour
    filter: *denied

  top_clients:
    kind: terms
    field: client_ip
    size: $top_n
    sub_aggs:
      bytes: {kind: sum, field: bytes}
      dests: {kind: cardinality, field: dest_ip}
      denied: {kind: filter, filter: *denied}
    transforms:
      - classify_ip: {}
      - derive_pct: {num: denied, den: count, to: denied_pct}

  # Usage by campus location (hostel wing, department). Covers clients in
  # mapped campus ranges only; unmapped clients are simply absent here.
  site_usage:
    kind: terms
    field: location
    size: $top_n
    optional: true
    sub_aggs:
      clients: {kind: cardinality, field: client_ip}
      bytes: {kind: sum, field: bytes}
      denied: {kind: filter, filter: *denied}
    transforms:
      - derive_pct: {num: denied, den: count, to: denied_pct}

  top_destinations:
    kind: terms
    field: dest_ip
    size: $top_n
    sub_aggs:
      bytes: {kind: sum, field: bytes}
      clients: {kind: cardinality, field: client_ip}

  bandwidth_clients:
    kind: terms
    field: client_ip
    size: $top_n
    order_by: bytes
    sub_aggs:
      bytes: {kind: sum, field: bytes}
    transforms:
      - classify_ip: {}

  dest_ports:
    kind: terms
    field: dest_port
    size: $top_n
    optional: true

  methods:
    kind: terms
    field: method
    size: 8
    optional: true

  # Where the traffic actually goes, by ASN organisation and country
  # (destination-side GeoIP enrichment; estates without it omit these).
  top_orgs:
    kind: terms
    field: dest_org
    size: $top_n
    optional: true
    sub_aggs:
      bytes: {kind: sum, field: bytes}
      clients: {kind: cardinality, field: client_ip}

  dest_countries:
    kind: terms
    field: dest_country
    size: $top_n
    optional: true

  # -- gateway health ----------------------------------------------------
  # How requests fail, and against which destinations. A destination
  # collecting failures from MANY clients is an outage; one client failing
  # against one destination over and over is a retry loop / beacon.
  error_breakdown:
    kind: terms
    field: action_detail
    size: 10
    optional: true
    filter: {field: outcome, equals: failure}
    sub_aggs:
      clients: {kind: cardinality, field: client_ip}
      dests: {kind: cardinality, field: dest_ip}

  failing_destinations:
    kind: terms
    field: dest_ip
    size: $top_n
    optional: true
    filter: *failed
    sub_aggs:
      clients: {kind: cardinality, field: client_ip}
      ports: {kind: top_terms, field: dest_port, size: 3}

  # Tunnels (CONNECT) to non-web ports. CONNECT only: for a plain HTTP
  # request the logged "port" can be a fragment of an IPv6 address (the
  # engine splits ...::3400:5900 into host ...::3400 and port 5900), which
  # produced phantom VNC / TeamViewer ports in earlier reports.
  unusual_port_traffic:
    kind: terms
    field: dest_port
    size: 10
    optional: true
    filter:
      all:
        - {field: method, equals: CONNECT}
        - {field: dest_port, in_param: unusual_ports}
    sub_aggs:
      allowed: {kind: filter, filter: {field: outcome, equals: success}}
      clients: {kind: top_terms, field: client_ip, size: 3}
      dests: {kind: top_terms, field: dest_ip, size: 3}

  # Non-web, NON-routine ports where the proxy actually let the tunnel
  # through. Denied or failed attempts were already stopped by policy and
  # do not need an analyst; allowed ones are worth confirming.
  unusual_port_allowed:
    kind: terms
    field: dest_port
    size: 10
    optional: true
    filter:
      all:
        - {field: method, equals: CONNECT}
        - {field: dest_port, in_param: unusual_ports}
        - none: [{field: dest_port, in_param: routine_ports}]
        - {field: outcome, equals: success}
    sub_aggs:
      clients: {kind: top_terms, field: client_ip, size: 3}
      dests: {kind: top_terms, field: dest_ip, size: 3}

  # Scan-like use of a routine port: many distinct destinations from one
  # client. Legitimate SSH reuses a handful of hosts.
  routine_port_scanners:
    kind: terms
    field: client_ip
    size: 500           # judged on destination spread, not on volume
    optional: true
    filter:
      all:
        - {field: method, equals: CONNECT}
        - {field: dest_port, in_param: routine_ports}
    sub_aggs:
      dests: {kind: cardinality, field: dest_ip}
      failed: {kind: filter, filter: {field: outcome, equals: failure}}
    transforms:
      - classify_ip: {}
      - min_count: {key: dests, value: $routine_port_scan_min}
      - sort: {key: dests}
      - limit: {size: $top_n}

  # Per-proxy-server breakdown. Grouped by the logical `proxy_instance`
  # field (e.g. squid's process name: squid-2, squid-4, squid-7 ...), so a
  # multi-node gateway shows which server carried the load and how each one
  # behaved. Optional + skip_if_unmapped: datasources that do not map an
  # instance field simply omit the whole section instead of failing.
  proxy_servers:
    kind: terms
    field: proxy_instance
    size: 25
    optional: true
    sub_aggs:
      clients: {kind: cardinality, field: client_ip}
      bytes: {kind: sum, field: bytes}
      denied: {kind: filter, filter: *denied}
      failed: {kind: filter, filter: *failed}
      dests: {kind: cardinality, field: dest_ip}
    transforms:
      - derive_pct: {num: denied, den: count, to: denied_pct}
      - derive_pct: {num: failed, den: count, to: failed_pct}
  server_count: {kind: cardinality, field: proxy_instance, optional: true}

  cache_actions: {kind: terms, field: cache_action, size: 10,
                  optional: true}
  status_codes: {kind: terms, field: status_code, size: $top_n}

  denied_clients:
    kind: terms
    field: client_ip
    size: $top_n
    filter: *denied
    sub_aggs:
      dests: {kind: top_terms, field: dest_ip, size: 2}
    transforms:
      - classify_ip: {}

  # The destination side of denials: one dest:port collecting hundreds of
  # denials from a single client is the signature of an automated retry
  # loop (mis-configured agent - or beaconing malware the ACL is holding).
  denied_destinations:
    kind: terms
    field: dest_ip
    size: $top_n
    filter: *denied
    sub_aggs:
      ports: {kind: top_terms, field: dest_port, size: 3}
      clients: {kind: top_terms, field: client_ip, size: 2}
      client_count: {kind: cardinality, field: client_ip}

  # Requests for the link-local cloud metadata service (169.254.169.254)
  # seen at the egress proxy. That address should never be reachable this
  # way: SSRF-style recon or a badly misconfigured cloud agent.
  metadata_probes:
    kind: terms
    field: client_ip
    size: 10
    optional: true
    filter: {field: url, wildcard: "*169.254.169.254*"}
    sub_aggs:
      urls: {kind: top_terms, field: url, size: 2}
    transforms:
      - classify_ip: {}

  prev_total: {kind: count, window: previous}

computed:
  - {name: total, expr: "q.total_requests or 0"}
  - {name: denied, expr: "q.denied_total or 0"}
  - {name: denied_rate, expr: "pct(c.denied, c.total)"}
  - {name: failed, expr: "q.failed_total or 0"}
  - {name: fail_rate, expr: "pct(c.failed, c.total)"}
  - name: other_errors
    expr: "max(0, c.total - (q.success_total or 0) - c.denied - c.failed)"
  - name: smb_traffic
    expr: "(q.unusual_port_traffic or [])
           | selectattr('key', 'in', [445, '445']) | list"
  - name: prev_reliable
    expr: "(q.prev_total or 0) >= c.total * params.prev_window_min_ratio
           and (q.prev_total or 0) > 0"
  - name: delta_requests
    expr: "delta_pct(c.total, q.prev_total) if c.prev_reliable else None"
  - name: data_warning
    expr: "None if c.prev_reliable or c.total == 0 else
           'Previous window logged only ' ~ human_int(q.prev_total) ~
           ' requests against ' ~ human_int(c.total) ~ ' now — trend
           comparison suppressed (likely ingest gap).'"

badges:
  - id: policy
    label: "Policy posture"
    levels:
      - {when: "c.denied_rate >= params.denied_rate_crit",
         text: ELEVATED, color: red}
      - {when: "c.denied_rate >= params.denied_rate_warn",
         text: WATCH, color: amber}
      - {text: ROUTINE, color: green}

  # Omitted entirely when the datasource does not map `action_detail`
  # (failed_total stays None, so no level matches).
  - id: gateway
    label: "Gateway health"
    levels:
      - {when: "q.failed_total is not none
                and c.fail_rate >= params.fail_rate_crit",
         text: DEGRADED, color: red}
      - {when: "q.failed_total is not none
                and c.fail_rate >= params.fail_rate_warn",
         text: WATCH, color: amber}
      - {when: "q.failed_total is not none", text: HEALTHY, color: green}

insights:
  - when: "c.total == 0"
    stop: true
    text: >
      No proxy traffic was recorded in the reporting window. Verify the log
      pipeline and that {{ ds.index }} is receiving documents.

  - text: >
      {{ human_int(c.total) }} proxied requests from
      {{ human_int(q.unique_clients) }} client hosts, moving
      {{ human_bytes(q.total_bytes) }}
      {%- if c.delta_requests is not none %}
      ({{ "▲" if c.delta_requests > 0 else "▼" }}
      {{ "%.1f" | format(c.delta_requests | abs) }}% vs previous
      {{ window.hours }}h){% endif %}.

  - when: "c.denied > 0"
    text: >
      {{ human_int(c.denied) }} requests
      ({{ "%.2f" | format(c.denied_rate) }}%) were denied by proxy policy.
      The clients generating denials are listed under Policy & Denials.

  - when: "c.denied == 0"
    text: "No requests were denied by proxy policy in this window."

  - when: "q.top_clients"
    text: >
      The most active client was {{ q.top_clients[0].key }}
      ({{ q.top_clients[0].location }}) with
      {{ human_int(q.top_clients[0].count) }} requests to
      {{ human_int(q.top_clients[0].dests) }} distinct destinations.

  - when: "q.bandwidth_clients"
    text: >
      The heaviest downloader was {{ q.bandwidth_clients[0].key }} with
      {{ human_bytes(q.bandwidth_clients[0].bytes) }} transferred.

  - when: "q.proxy_servers and (q.server_count or 0) > 1"
    text: >
      Traffic was handled by {{ human_int(q.server_count) }} proxy servers.
      The busiest was {{ q.proxy_servers[0].key }} with
      {{ human_int(q.proxy_servers[0].count) }} requests
      ({{ "%.1f" | format(pct(q.proxy_servers[0].count, c.total)) }}% of
      the total); the per-server breakdown is under Usage.

  - when: "c.failed > 0 and q.failed_total is not none"
    text: >
      {{ human_int(c.failed) }} requests
      ({{ "%.2f" | format(c.fail_rate) }}%) failed to establish an
      upstream connection.
      {%- if q.failing_destinations %} The destination failing most was
      {{ q.failing_destinations[0].key }} with
      {{ human_int(q.failing_destinations[0].count) }} failed attempts
      from {{ human_int(q.failing_destinations[0].clients) }}
      client(s){%- if q.failing_destinations[0].ports %} on port
      {{ q.failing_destinations[0].ports }}{% endif %}.{% endif %}
      {%- if c.fail_rate >= params.fail_rate_warn %} At this rate the cause
      is more likely the upstream link or DNS on the gateway than policy —
      see Gateway health.
      {%- else %} At this level failures are normal background (unreachable
      peers, P2P and update targets), not a gateway fault.{% endif %}

  - when: "q.top_orgs"
    text: >
      The most-contacted destination network was
      "{{ q.top_orgs[0].key }}" with
      {{ human_int(q.top_orgs[0].count) }} requests from
      {{ human_int(q.top_orgs[0].clients) }} clients
      ({{ human_bytes(q.top_orgs[0].bytes) }} transferred).

  - when: "q.metadata_probes"
    text: >
      {{ human_int(q.metadata_probes | length) }} client(s) requested the
      cloud metadata address 169.254.169.254 through the proxy —
      see Policy & Denials for the host list.

  - when: "q.unusual_port_traffic"
    text: >
      Tunnels to non-web ports were seen:
      {% for r in q.unusual_port_traffic[:4] %}port {{ r.key }}
      ({{ human_int(r.count) }} requests, {{ human_int(r.allowed) }}
      allowed){{ ", " if not loop.last }}
      {%- endfor %}. Outbound SSH (22) is routine and not an incident on
      its own; the Unusual Destination Ports table lists the sources.

  - when: "q.hourly"
    text: >
      {% set peak = q.hourly | max(attribute='count') %}
      Proxy usage peaked around {{ peak.label }} {{ window.tz_label }}
      with {{ human_int(peak.count) }} requests in the hour.

actions:
  - when: "q.metadata_probes"
    priority: P2
    owner: "SOC"
    text: >
      Requests for the cloud metadata address 169.254.169.254 reached the
      egress proxy from
      {{ q.metadata_probes | map(attribute='key') | join(', ') }}.
      That link-local address should never be routable here — check the
      hosts for SSRF exploitation or a misconfigured cloud agent.

  - when: "c.smb_traffic"
    priority: P2
    owner: "SOC"
    text: >
      Outbound SMB (port 445) was attempted through the proxy
      ({{ human_int(c.smb_traffic[0].count) }} requests; clients:
      {{ c.smb_traffic[0].clients }}). SMB to external addresses is
      classic worm/scanner behaviour — isolate and inspect these hosts.

  - when: "q.unusual_port_allowed"
    priority: P2
    owner: "SOC"
    text: >
      The proxy let tunnels through to non-web ports
      {% for r in q.unusual_port_allowed[:4] %}{{ r.key }}
      ({{ human_int(r.count) }}, from {{ r.clients }}){{ ", " if not loop.last }}
      {%- endfor %}. Confirm they are sanctioned remote-access or admin use;
      if not, tighten the proxy's allowed-ports policy for those ports.

  - when: "q.routine_port_scanners"
    priority: P3
    owner: "SOC"
    text: >
      Client {{ q.routine_port_scanners[0].key }} opened SSH tunnels to
      {{ human_int(q.routine_port_scanners[0].dests) }} distinct hosts
      ({{ human_int(q.routine_port_scanners[0].failed) }} failed) — that is
      scanning or brute-forcing, not administration. Identify the host
      owner and the process.

  - when: "q.denied_destinations and q.denied_destinations[0].count >= 100"
    priority: P3
    owner: "SOC"
    text: >
      Destination {{ q.denied_destinations[0].key }} (ports
      {{ q.denied_destinations[0].ports }}) was denied
      {{ human_int(q.denied_destinations[0].count) }} times for
      {{ human_int(q.denied_destinations[0].client_count) }} client(s);
      the two busiest were {{ q.denied_destinations[0].clients }}. Requests
      repeated at this rate are software retrying automatically, not people
      browsing. Identify the application on those clients; if it is
      legitimate, either allow the destination or stop the application.

  - when: "q.failed_total is not none
           and c.fail_rate >= params.fail_rate_warn"
    priority: P3
    owner: "Network team"
    text: >
      {{ "%.2f" | format(c.fail_rate) }}% of proxied requests failed to
      connect upstream. Check gateway uplinks and DNS resolution on the
      proxy nodes; the per-server table shows whether the failures
      concentrate on specific instances.

  - when: "q.denied_clients and q.denied_clients[0].count >= 100"
    priority: P3
    owner: "SOC"
    text: >
      Client {{ q.denied_clients[0].key }} generated
      {{ human_int(q.denied_clients[0].count) }} policy denials —
      repeated denials usually mean misconfigured software or a user
      probing the policy. Identify the host owner.

  - when: "c.denied_rate >= params.denied_rate_warn"
    priority: P3
    owner: "Network team"
    text: >
      Overall denial rate is {{ "%.2f" | format(c.denied_rate) }}%.
      If this is new, check whether a policy change or a block-list update
      is over-matching legitimate destinations.

sections:
  - {type: heading, title: "Executive summary"}
  - {type: insights}

  - type: kpi_row
    items:
      - {label: "Proxied requests", value: "c.total", format: int,
         delta: "c.delta_requests"}
      - {label: "Client hosts", value: "q.unique_clients", format: int}
      - {label: "Data transferred", value: "q.total_bytes", format: bytes}
      - {label: "Policy denials", value: "c.denied", format: int,
         style: "'crit' if c.denied_rate >= params.denied_rate_crit else
                 ('warn' if c.denied_rate >= params.denied_rate_warn
                 else 'ok')",
         foot: "{{ '%.2f' | format(c.denied_rate) }}% of requests"}
      - {label: "Failed connections", value: "c.failed", format: int,
         style: "'crit' if c.fail_rate >= params.fail_rate_crit else
                 ('warn' if c.fail_rate >= params.fail_rate_warn
                 else 'ok')",
         foot: "{{ '%.2f' | format(c.fail_rate) }}% of requests"}

  - {type: heading, title: "Usage"}
  - type: timeseries
    title: "Requests per hour"
    query: hourly
    overlay: hourly_denied
    series_label: "requests / hour"
    overlay_label: "denied requests"

  - type: table
    title: "Top clients"
    query: top_clients
    columns:
      - {key: key, label: "Client IP", format: mono, width: 110, nowrap: true}
      - {key: scope, label: "Class", format: pill,
         pill_map: {INTERNAL: ok, BOT: grey, EXTERNAL: warn}}
      - {key: count, label: "Requests", format: int}
      - {key: dests, label: "Destinations", format: int}
      - {key: denied_pct, label: "Denied %", format: pct}
      - {key: bytes, label: "Bandwidth", format: bytes}

  - type: table
    title: "Usage by campus location"
    query: site_usage
    hide_if_empty: true
    note: "Only clients inside mapped campus address ranges carry a
           location, so this is a subset of all traffic, not a total."
    columns:
      - {key: key, label: "Location", max: 30}
      - {key: count, label: "Requests", format: int}
      - {key: clients, label: "Clients", format: int}
      - {key: denied_pct, label: "Denied %", format: pct}
      - {key: bytes, label: "Bandwidth", format: bytes}

  - type: row
    left:
      type: table
      title: "Top destinations"
      query: top_destinations
      columns:
        - {key: key, label: "Destination", format: mono, max: 22}
        - {key: count, label: "Requests", format: int}
        - {key: bytes, label: "Bytes", format: bytes}
    right:
      type: table
      title: "Bandwidth by client"
      query: bandwidth_clients
      columns:
        - {key: key, label: "Client", format: mono, width: 100, nowrap: true}
        - {key: count, label: "Requests", format: int}
        - {key: bytes, label: "Bytes", format: bytes}

  - type: row
    left:
      type: bars
      title: "Destination ports"
      query: dest_ports
      color: navy
      show_pct: true
    right:
      type: bars
      title: "Cache / tunnel actions"
      query: cache_actions
      color: teal
      show_pct: true

  - type: row
    left:
      type: donut
      title: "Request outcomes"
      show_if: "c.total > 0 and q.failed_total is not none"
      center_label: "requests"
      slices:
        - {label: "Succeeded", expr: "q.success_total or 0", color: green}
        - {label: "Policy denied", expr: "c.denied", color: amber}
        - {label: "Upstream failed", expr: "c.failed", color: red}
        - {label: "Other errors", expr: "c.other_errors", color: grey}
    right:
      type: bars
      title: "HTTP methods"
      query: methods
      skip_if_unmapped: [method]
      color: navy
      show_pct: true

  # Destination-side enrichment: which networks and countries the estate
  # talks to. Rendered only when the datasource maps the GeoIP/ASN fields.
  - type: row
    left:
      type: bars
      title: "Destination networks (ASN)"
      query: top_orgs
      skip_if_unmapped: [dest_org]
      color: sky
      show_pct: true
    right:
      type: bars
      title: "Destination countries"
      query: dest_countries
      skip_if_unmapped: [dest_country]
      color: purple
      show_pct: true

  - type: table
    title: "Traffic by proxy server"
    query: proxy_servers
    skip_if_unmapped: [proxy_instance]
    hide_if_empty: true
    note: "Each row is one proxy instance (its process name). Use it to see
           which server carried the load, how much it moved, and whether any
           single node accounts for an unusual share of denials."
    columns:
      - {key: key, label: "Server", format: mono, width: 120, nowrap: true}
      - {key: count, label: "Requests", format: int}
      - {key: clients, label: "Clients", format: int}
      - {key: dests, label: "Destinations", format: int}
      - {key: denied, label: "Denials", format: int}
      - {key: denied_pct, label: "Denied %", format: pct}
      - {key: failed, label: "Failed", format: int}
      - {key: failed_pct, label: "Failed %", format: pct}
      - {key: bytes, label: "Bandwidth", format: bytes}

  - {type: heading, title: "Gateway health"}
  - type: timeseries
    title: "Upstream connection failures per hour"
    query: hourly_failed
    skip_if_unmapped: [action_detail]
    color: red
    series_label: "failed connects / hour"
    note: "Requests the proxy accepted but could not connect upstream
           (squid NONE/503). A flat non-zero floor is normal background
           noise; spikes across many destinations mean uplink or DNS
           trouble on the gateway."

  - type: row
    left:
      type: table
      title: "Failure types"
      query: error_breakdown
      hide_if_empty: true
      columns:
        - {key: key, label: "Failure", format: mono, max: 24}
        - {key: count, label: "Requests", format: int}
        - {key: clients, label: "Clients", format: int}
        - {key: dests, label: "Destinations", format: int}
    right:
      type: table
      title: "Top failing destinations"
      query: failing_destinations
      hide_if_empty: true
      note: "Many clients failing on one destination = that service or the
             route to it is down. One client failing repeatedly = a retry
             loop worth a look."
      columns:
        - {key: key, label: "Destination", format: mono, width: 110,
           nowrap: true}
        - {key: count, label: "Failures", format: int}
        - {key: clients, label: "Clients", format: int}
        - {key: ports, label: "Ports", format: mono, max: 18}

  - {type: heading, title: "Policy & denials"}
  - type: table
    title: "Unusual destination ports (non-web)"
    query: unusual_port_traffic
    hide_if_empty: true
    note: "CONNECT tunnels to non-web ports. Port 22 is routine outbound
           SSH; the actionable rows are other ports the proxy let through
           (the Allowed column). Denied or failed attempts were already
           stopped by policy."
    columns:
      - {key: key, label: "Port"}
      - {key: count, label: "Requests", format: int}
      - {key: allowed, label: "Allowed", format: int}
      - {key: clients, label: "Top clients", format: mono, max: 40}
      - {key: dests, label: "Top destinations", format: mono, max: 40}

  - type: table
    title: "Clients with policy denials"
    query: denied_clients
    hide_if_empty: true
    columns:
      - {key: key, label: "Client IP", format: mono, width: 110, nowrap: true}
      - {key: scope, label: "Class", format: pill,
         pill_map: {INTERNAL: ok, BOT: grey, EXTERNAL: warn}}
      - {key: count, label: "Denials", format: int}
      - {key: dests, label: "Attempted destinations", format: mono,
         max: 40}

  - type: table
    title: "Most-denied destinations"
    query: denied_destinations
    hide_if_empty: true
    note: "One destination:port collecting hundreds of denials from a
           single client is the signature of an automated retry loop —
           a mis-configured agent, or beaconing malware the ACL is
           currently holding."
    columns:
      - {key: key, label: "Destination", format: mono, width: 130,
         nowrap: true}
      - {key: count, label: "Denials", format: int}
      - {key: ports, label: "Ports", format: mono, max: 20}
      - {key: clients, label: "Top clients", format: mono, max: 40}

  - type: table
    title: "Cloud metadata probes (169.254.169.254)"
    query: metadata_probes
    skip_if_unmapped: [url]
    hide_if_empty: true
    note: "The link-local metadata address should never be reachable
           through an egress proxy — treat as SSRF-style recon or a badly
           misconfigured cloud agent on the client."
    columns:
      - {key: key, label: "Client IP", format: mono, width: 110,
         nowrap: true}
      - {key: scope, label: "Class", format: pill,
         pill_map: {INTERNAL: ok, BOT: grey, EXTERNAL: warn}}
      - {key: count, label: "Requests", format: int}
      - {key: urls, label: "Requested URLs", format: mono, max: 60}

  - type: bars
    title: "Status codes"
    query: status_codes
    color: blue

  - {type: heading, title: "Recommended actions"}
  - {type: actions}
