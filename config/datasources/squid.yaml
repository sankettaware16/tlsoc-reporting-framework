# ===========================================================================
# Datasource: Squid forward proxy (parsed by foss-soc-engine).
# ===========================================================================
name: squid
label: "Internet Gateway (Squid Forward Proxy)"
profile: proxy
index: "fosstlsoc-logs-squid*"

fields:
  timestamp: "@timestamp"
  client_ip: "source.ip"
  client_port: "source.port"
  dest_ip: "destination.ip"
  dest_port: "destination.port"
  bytes: "source.bytes"
  duration_ms: "event.duration"
  cache_action: "event.action.keyword"
  outcome: "event.outcome.keyword"
  status_code: "http.response.status_code"
  method: "http.request.method.keyword"
  protocol: "network.protocol.keyword"
  # The proxy instance that served the request (squid-2, squid-4, squid-7,
  # ...): each worker/instance is emitted as its own process name, so this
  # doubles as the "which server handled it" dimension for the traffic
  # breakdown. Now indexed on this estate, so the per-server section renders.
  proxy_instance: "process.name.keyword"
  # original destination host (the real target behind a CONNECT tunnel)
  original_destination: "squid.original_destination.keyword"
  # Fine-grained result of the transaction as parsed by the engine:
  # access_denied / connection_failed / malformed_transaction / ...
  # Drives the gateway-health section (upstream failures vs policy denials).
  action_detail: "event.action_detail.keyword"
  # GeoIP/ASN enrichment on the destination side. Optional on other
  # estates - every section using them degrades gracefully when absent.
  dest_org: "destination.as.organization.name.keyword"
  dest_country: "destination.geo.country_name.keyword"
  # Plain-HTTP requests carry the full URL; CONNECT tunnels do not. Used
  # for the cloud-metadata (169.254.169.254) probe check.
  url: "url.original.keyword"
  dest_domain: "destination.domain.keyword"
  # proxy_host: "host.name"  # the client-facing VIP - not indexed here

# host.name (the client-facing gateway VIP) is NOT indexed on this estate:
# it appears only inside event.original and is never extracted at parse
# time. That mapping stays commented out, so any section grouping by it is
# omitted rather than failing. To enable it, add a grok field for the
# hostname in the log pipeline, uncomment the line and re-run:
#     python3 -m framework check-fields --datasource squid

params: {}
