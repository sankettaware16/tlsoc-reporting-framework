# ===========================================================================
# Datasource: nginx reverse-proxy edge (parsed by foss-soc-engine).
#
# Since the multi-vhost rollout this edge fronts the whole campus web
# estate (~115 domains, vh3/vh4 nodes), and the index carries THREE
# document shapes, told apart by event.type:
#   * access  - one per served request (has http.response.status_code)
#   * error   - nginx error-log lines: rate/connection limiting,
#               upstream connect/timeout failures, SSL handshake noise
#               (event.action names the kind; no status code)
#   * denied  - NAXSI WAF blocks (event.action: waf_block, rule.* and
#               nginx.naxsi.* carry the rule, category, zone)
# The report scopes traffic metrics to access lines via `status_code
# exists`; the WAF and edge-health sections read the other two shapes.
#
# The `fields:` map translates the LOGICAL names used by report
# definitions into the concrete fields of this index - including any
# .keyword suffix a field needs to be aggregatable. Verified against the
# live fosstlsoc-logs-nginx* mapping (framework check-fields).
#
# A logical field that does not exist here is simply left out: every
# report section that depends on it is omitted automatically.
# ===========================================================================
name: nginx
label: "Web Infrastructure (Nginx / Reverse Proxy)"
profile: web_access
index: "fosstlsoc-logs-nginx*"

fields:
  timestamp: "@timestamp"
  client_ip: "source.ip"
  status_code: "http.response.status_code"
  response_bytes: "http.response.body.bytes"
  url_path: "url.path"                          # keyword, NO .keyword
  url_query: "url.query.keyword"
  method: "http.request.method.keyword"         # text + .keyword
  referrer: "http.request.referrer.keyword"
  user_agent: "user_agent.original.keyword"
  geo_country: "source.geo.country_name"        # keyword, NO .keyword
  geo_city: "source.geo.city_name"

  # The virtual host the request addressed ($host, first token of the
  # vhost-first log format). Present on access AND error/denied docs, so
  # the per-domain traffic, scanning, WAF and upstream tables all share it.
  domain: "url.domain.keyword"
  # The edge node that served the request (vh3.iitb.ac.in / vh4.iitb.ac.in).
  edge_server: "host.name.keyword"
  # Source-side ASN enrichment (org name); mapped for future use.
  asn_org: "source.as.organization.name.keyword"

  # -- error/denied documents only ----------------------------------------
  # rate_limit / connection_limit / waf_block / upstream_connection_refused
  # / upstream_timeout / upstream_connect_failed / ssl_handshake_failure /
  # nginx_error_unclassified ... Absent on access lines, which is what
  # keeps the edge tables scoped without an extra filter.
  event_action: "event.action.keyword"
  # NAXSI (event.action: waf_block): first matched rule broken out.
  waf_rule_id: "rule.id.keyword"                # 1000-1399 core, <1000 internal
  waf_rule_category: "rule.category.keyword"    # $SQL / $XSS / $RFI / $TRAVERSAL
  waf_zone: "nginx.naxsi.zone.keyword"          # URL / ARGS / BODY / HEADERS
  waf_mode: "nginx.naxsi.mode.keyword"          # block / drop / learning
  # nginx limit_req zone that fired (ip_domain_high / ip_domain_medium ...).
  rate_limit_zone: "nginx.rate_limit.zone.keyword"
  # Backend URL a failed upstream attempt targeted.
  upstream: "nginx.upstream.keyword"

  # service.name is intentionally NOT mapped any more: since the vhost-first
  # format it only distinguishes the syslog program (vhnginx_access /
  # vhnginx_error), which is a document-shape label, not a site. The
  # per-site dimension is `domain` above.

params:
  # Load balancers, reverse proxies and monitoring in front of this estate,
  # excluded from volume-anomaly flagging (their volume is expected).
  # infrastructure_cidrs:
  #   - "10.0.0.0/24"

  # Campus/estate PUBLIC ranges, counted as internal alongside RFC-1918.
  # internal_cidrs:
  #   - "203.0.113.0/24"

  # Site areas: path-mounted sections of the MAIN Drupal estate
  # (www.iitb.ac.in). With ~115 vhosts on this edge the headline
  # segmentation is now the per-domain tables; these path prefixes still
  # break the main site itself into its sections (they are distinctive
  # enough not to collide with other vhosts' paths).
  main_site_name: "www.iitb.ac.in (main site)"

  site_areas:
    - {name: "Dean (Planning)",        prefix: "/deanpl"}
    - {name: "Women Students' Cell",   prefix: "/womenstudents"}
    - {name: "Academic Section",       prefix: "/academichome"}
    - {name: "New Academic Home",      prefix: "/newacadhome"}
    - {name: "MEMS",                   prefix: "/mems"}
    - {name: "Hospital",               prefix: "/hospital"}
    - {name: "IPR Cell",               prefix: "/ipriks"}
    - {name: "Career / Recruitment",   prefix: "/career"}
    - {name: "Breaking News",          prefix: "/breaking-news"}

  # First-party application paths on this estate (Drupal across most
  # vhosts). Extends the report's benign allowlist so core assets never
  # count as probes.
  extra_benign_path_prefixes:
    - "/core/assets/"
    - "/core/misc/"
    - "/core/modules/"
    - "/core/themes/"
    - "/themes/"
    - "/libraries/"
    - "/modules/contrib/"
    - "/modules/custom/"
    - "/profiles/"
    - "/sites/default/files/"
    # Drupal ships a stock IIS web.config in its web root; it holds no
    # secrets (verified) and is served as a static file.
    - "/web.config"

  # Login/credential surface for Drupal + SSO (matches on any vhost).
  auth_path_patterns:
    - "/user/login*"
    - "/user/password*"
    - "/user/register*"
    - "/user/reset*"
    - "/saml_login*"
    - "/admin*"
    - "/login*"
    - "/signin*"

  # Campus PUBLIC ranges to tag as INTERNAL (RFC-1918 is automatic).
  internal_cidrs: []
  #  - "203.0.113.0/24"
  #  - "198.51.100.0/24"
